services:
  - type: web
    name: missiondeck
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DEPLOYMENT_MODE
        value: hosted
      - key: DATABASE_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: missiondeck-db
          property: connectionString
      - key: PROVIDER_MODE
        value: fixture
      - key: MODEL_MODE
        value: live
      - key: MODEL_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-5.6-luna
      - key: PUBLIC_DEMO_ENABLED
        value: "true"
      - key: PUBLIC_DEMO_MAX_MISSIONS
        value: 1
      - key: PUBLIC_DEMO_MAX_CONCURRENT
        value: 4
      - key: PUBLIC_DEMO_SESSION_LIMIT
        value: 3
      - key: PUBLIC_DEMO_MAX_SOURCE_REVISIONS
        value: 2
      - key: PUBLIC_DEMO_MAX_MODEL_CALLS
        value: 20
      - key: PUBLIC_DEMO_DAILY_MODEL_LIMIT
        value: 200
      - key: WORKSPACE_UPGRADE_ENABLED
        value: "true"

databases:
  - name: missiondeck-db
    plan: free
    ipAllowList: []
