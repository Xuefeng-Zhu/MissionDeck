services:
  - type: web
    name: missiondeck
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DEPLOYMENT_MODE
        value: hosted
      - key: DATABASE_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: missiondeck-db
          property: connectionString
      - key: PROVIDER_MODE
        value: fixture
      - key: MODEL_MODE
        value: live
      - key: MODEL_PROVIDER
        value: bedrock
      - key: AWS_REGION
        value: us-west-2
      - key: BEDROCK_MODEL_ID
        value: us.openai.gpt-5.6-luna
      # The free Blueprint path uses a least-privileged static IAM principal.
      # On Render plans with OIDC, prefer AWS_ROLE_ARN plus the automatically
      # supplied web-identity token instead of long-lived access keys.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: PUBLIC_DEMO_ENABLED
        value: "true"
      - key: PUBLIC_DEMO_MAX_MISSIONS
        value: 1
      - key: PUBLIC_DEMO_MAX_CONCURRENT
        value: 4
      - key: PUBLIC_DEMO_SESSION_LIMIT
        value: 3
      - key: PUBLIC_DEMO_MAX_SOURCE_REVISIONS
        value: 2
      - key: PUBLIC_DEMO_MAX_MODEL_CALLS
        value: 20
      - key: PUBLIC_DEMO_DAILY_MODEL_LIMIT
        value: 200
      - key: WORKSPACE_UPGRADE_ENABLED
        value: "true"

databases:
  - name: missiondeck-db
    plan: free
    ipAllowList: []
