<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MissionDeck release-readiness agent architecture</title>
  <desc id="desc">Reviewed sources enter a durable MissionDeck coordinator. Strands agents use Amazon Bedrock Converse with Nova 2 Lite to extract evidence, run readiness and risk analysis in parallel, and synthesize a cited brief. A human records a Decision Receipt before a fresh launch-pack invocation. Documents are written and read back before human outcome verification.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf6e9"/>
      <stop offset="1" stop-color="#f3ead8"/>
    </linearGradient>
    <linearGradient id="inkPanel" x1="0" x2="1">
      <stop offset="0" stop-color="#13262c"/>
      <stop offset="1" stop-color="#1c3439"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14262c" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#d85d32"/>
    </marker>
    <marker id="arrowInk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#29484f"/>
    </marker>
    <style>
      .display { font-family: Georgia, 'Times New Roman', serif; fill: #14262c; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #29484f; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2.1px; }
      .title { font-size: 48px; font-weight: 700; letter-spacing: -1.1px; }
      .subtitle { font-size: 20px; }
      .box-title { font-size: 18px; font-weight: 750; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .number { font-size: 13px; font-weight: 800; fill: #fbf6e9; }
      .on-dark { fill: #fffaf0; }
      .on-dark-muted { fill: #d9e4df; }
      .on-dark-accent { fill: #efbd9d; }
      .line { fill: none; stroke: #d85d32; stroke-width: 3; marker-end: url(#arrow); }
      .line-ink { fill: none; stroke: #29484f; stroke-width: 2.5; marker-end: url(#arrowInk); }
      .line-dash { fill: none; stroke: #708a88; stroke-width: 2; stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <circle cx="1470" cy="-30" r="260" fill="#e56b3f" opacity="0.09"/>
  <circle cx="85" cy="865" r="250" fill="#1c6a68" opacity="0.08"/>

  <text x="80" y="80" class="sans eyebrow" fill="#d85d32">MISSIONDECK · PROFESSIONAL AGENT</text>
  <text x="80" y="138" class="display title">From scattered launch evidence to an accountable decision</text>
  <text x="80" y="174" class="sans subtitle">Read-only Strands analysis. One human judgment. Durable, cited output.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="235" width="300" height="462" rx="24" fill="#fffdf7" stroke="#d6cbb8" stroke-width="2"/>
  </g>
  <circle cx="116" cy="275" r="17" fill="#d85d32"/>
  <text x="116" y="280" text-anchor="middle" class="sans number">1</text>
  <text x="146" y="282" class="sans eyebrow">REVIEWED SOURCES</text>
  <text x="112" y="326" class="display box-title">Named, editable snapshots</text>

  <g>
    <rect x="112" y="354" width="236" height="76" rx="13" fill="#f6eadc" stroke="#d8bda7"/>
    <rect x="124" y="369" width="7" height="46" rx="3.5" fill="#d85d32"/>
    <text x="146" y="387" class="sans box-title">Requirements</text>
    <text x="146" y="410" class="sans small">Promises and success criteria</text>
  </g>
  <g>
    <rect x="112" y="446" width="236" height="76" rx="13" fill="#edf3ef" stroke="#b9ccc4"/>
    <rect x="124" y="461" width="7" height="46" rx="3.5" fill="#1c6a68"/>
    <text x="146" y="479" class="sans box-title">Engineering status</text>
    <text x="146" y="502" class="sans small">Readiness and known gaps</text>
  </g>
  <g>
    <rect x="112" y="538" width="236" height="76" rx="13" fill="#eef0f5" stroke="#c5c9d3"/>
    <rect x="124" y="553" width="7" height="46" rx="3.5" fill="#50647d"/>
    <text x="146" y="571" class="sans box-title">Customer feedback</text>
    <text x="146" y="594" class="sans small">Needs, objections, and risk</text>
  </g>
  <text x="112" y="652" class="sans small">Bound to a source revision</text>
  <text x="112" y="674" class="sans small">Sources are data, never authority</text>

  <g filter="url(#shadow)">
    <rect x="452" y="225" width="254" height="482" rx="24" fill="url(#inkPanel)"/>
  </g>
  <circle cx="490" cy="265" r="17" fill="#e56b3f"/>
  <text x="490" y="270" text-anchor="middle" class="sans number">2</text>
  <text x="520" y="272" class="sans eyebrow on-dark-accent">DURABLE CORE</text>
  <text x="484" y="320" class="display on-dark" font-size="30" font-weight="700">MissionDeck</text>
  <text x="484" y="347" class="sans body on-dark-muted">Coordinator owns authority</text>
  <line x1="484" y1="376" x2="674" y2="376" stroke="#466068"/>
  <g class="sans body on-dark-muted">
    <text x="484" y="414">• source revisions</text>
    <text x="484" y="449">• task and run leases</text>
    <text x="484" y="484">• idempotent requests</text>
    <text x="484" y="519">• model/tool budgets</text>
    <text x="484" y="554">• human decisions</text>
    <text x="484" y="589">• write journal + read-back</text>
    <text x="484" y="624">• recovery and history</text>
  </g>
  <rect x="484" y="654" width="190" height="29" rx="14.5" fill="#26464c" stroke="#587077"/>
  <text x="579" y="674" text-anchor="middle" class="sans small on-dark">PostgreSQL state</text>
  <path d="M380 468 H438" class="line"/>

  <g filter="url(#shadow)">
    <rect x="778" y="225" width="742" height="286" rx="24" fill="#fffdf8" stroke="#cfc6b5" stroke-width="2"/>
  </g>
  <circle cx="816" cy="265" r="17" fill="#d85d32"/>
  <text x="816" y="270" text-anchor="middle" class="sans number">3</text>
  <text x="846" y="272" class="sans eyebrow">STRANDS AGENTS · AMAZON BEDROCK</text>
  <text x="1242" y="272" class="sans small" fill="#6b817f">Nova 2 Lite · Converse tools</text>

  <rect x="816" y="319" width="170" height="104" rx="16" fill="#f6eadc" stroke="#d8bda7"/>
  <text x="901" y="352" text-anchor="middle" class="sans box-title">Evidence</text>
  <text x="901" y="378" text-anchor="middle" class="sans body">extract + cite</text>
  <text x="901" y="402" text-anchor="middle" class="sans small">literal excerpts</text>

  <rect x="1056" y="296" width="176" height="86" rx="16" fill="#edf3ef" stroke="#b9ccc4"/>
  <text x="1144" y="330" text-anchor="middle" class="sans box-title">Readiness</text>
  <text x="1144" y="355" text-anchor="middle" class="sans small">what is launchable?</text>

  <rect x="1056" y="399" width="176" height="86" rx="16" fill="#fff0e8" stroke="#e3b59e"/>
  <text x="1144" y="433" text-anchor="middle" class="sans box-title">Risk</text>
  <text x="1144" y="458" text-anchor="middle" class="sans small">what could harm trust?</text>

  <rect x="1302" y="319" width="178" height="104" rx="16" fill="#e9efef" stroke="#afc2c0"/>
  <text x="1391" y="352" text-anchor="middle" class="sans box-title">Synthesis</text>
  <text x="1391" y="378" text-anchor="middle" class="sans body">options + impacts</text>
  <text x="1391" y="402" text-anchor="middle" class="sans small">cited recommendation</text>

  <path d="M986 371 C1018 371 1018 339 1044 339" class="line-ink"/>
  <path d="M986 371 C1018 371 1018 442 1044 442" class="line-ink"/>
  <path d="M1232 339 C1265 339 1266 359 1290 365" class="line-ink"/>
  <path d="M1232 442 C1265 442 1266 385 1290 377" class="line-ink"/>
  <path d="M706 367 H764" class="line"/>

  <g filter="url(#shadow)">
    <rect x="778" y="566" width="344" height="242" rx="24" fill="#d85d32"/>
  </g>
  <circle cx="816" cy="606" r="17" fill="#fff7e9"/>
  <text x="816" y="611" text-anchor="middle" class="sans" font-size="13" font-weight="800" fill="#d85d32">4</text>
  <text x="846" y="613" class="sans eyebrow" fill="#fff3e8">HUMAN GATE</text>
  <text x="814" y="658" class="display" font-size="30" font-weight="700" fill="#fffaf0">Decision Receipt</text>
  <g class="sans body" fill="#fff8ef">
    <text x="814" y="693">Source + analysis version</text>
    <text x="814" y="724">Selected option + constraints</text>
    <text x="814" y="755">What must change downstream</text>
  </g>
  <rect x="814" y="774" width="270" height="21" rx="10" fill="#bd4823"/>
  <text x="949" y="789" text-anchor="middle" class="sans small" fill="#fff8ef">source change → fresh decision</text>

  <g filter="url(#shadow)">
    <rect x="1172" y="566" width="348" height="242" rx="24" fill="#fffdf8" stroke="#cfc6b5" stroke-width="2"/>
  </g>
  <circle cx="1210" cy="606" r="17" fill="#1c6a68"/>
  <text x="1210" y="611" text-anchor="middle" class="sans number">5</text>
  <text x="1240" y="613" class="sans eyebrow">CITED LAUNCH PACK</text>
  <text x="1208" y="657" class="display box-title">Fresh Strands invocation</text>
  <g class="sans body">
    <text x="1208" y="693">Launch brief + checklist</text>
    <text x="1208" y="724">Announcement draft + risks</text>
    <text x="1208" y="755">“What changed” summary</text>
  </g>
  <rect x="1208" y="774" width="274" height="21" rx="10" fill="#e8f0ed"/>
  <text x="1345" y="789" text-anchor="middle" class="sans small">save → read back → verify</text>

  <path d="M1391 423 C1391 514 950 504 950 552" class="line"/>
  <path d="M1122 687 H1158" class="line"/>
  <path d="M580 707 C580 828 1345 827 1345 821" class="line-dash"/>
  <rect x="504" y="830" width="894" height="38" rx="19" fill="#e6ece9" stroke="#b8c8c2"/>
  <text x="951" y="855" text-anchor="middle" class="sans body">Workspace tasks + restricted documents · allowlisted writes · verified provider read-back · human outcome attestation</text>

  <text x="80" y="855" class="sans small">Solid orange = workflow authority</text>
  <text x="80" y="877" class="sans small">Dashed = durable workspace delivery</text>
</svg>
